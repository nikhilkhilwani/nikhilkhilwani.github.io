<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nikhil Khilwani — Coming Soon</title>
<meta name="description" content="Personal portfolio of Nikhil Khilwani. New site coming soon.">
<meta name="theme-color" content="#07080c">
<meta property="og:title" content="Nikhil Khilwani — Coming Soon">
<meta property="og:description" content="Personal portfolio of Nikhil Khilwani. New site coming soon.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Fraunces:opsz,wght@9..144,300;9..144,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07080c;
    --ink:#f2f4f8;
    --ink-dim:#9aa3b2;
    --ink-faint:#5b6472;
    --accent:#6ee7d7;
    --line:rgba(255,255,255,.09);
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --pad-x:clamp(24px,6vw,80px);
    --pad-y:clamp(20px,4vw,32px);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    /* min-height, not height: short viewports (landscape phones) must scroll,
       not overflow the 1fr row onto the footer. dvh dodges mobile URL-bar resize. */
    min-height:100vh;
    min-height:100dvh;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    display:grid;
    grid-template-rows:1fr auto;
    overflow-x:hidden;
  }

  /* ambient background */
  .aura{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .aura span{
    position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;
    animation:drift 22s ease-in-out infinite alternate;
  }
  .aura span:nth-child(1){width:52vmax;height:52vmax;left:-14vmax;top:-18vmax;background:radial-gradient(circle,#1d4e63,transparent 70%)}
  .aura span:nth-child(2){width:44vmax;height:44vmax;right:-12vmax;top:8vmax;background:radial-gradient(circle,#3b2c63,transparent 70%);animation-delay:-7s}
  .aura span:nth-child(3){width:38vmax;height:38vmax;left:22vmax;bottom:-16vmax;background:radial-gradient(circle,#1c5346,transparent 70%);animation-delay:-13s}
  @keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(4vmax,-3vmax,0) scale(1.12)}}

  .grid{
    position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:72px 72px;
    -webkit-mask-image:radial-gradient(ellipse 80% 65% at 50% 40%,#000 20%,transparent 78%);
    mask-image:radial-gradient(ellipse 80% 65% at 50% 40%,#000 20%,transparent 78%);
  }

  main{
    position:relative;z-index:1;
    display:flex;flex-direction:column;justify-content:center;
    padding:clamp(40px,8vw,80px) max(var(--pad-x),env(safe-area-inset-left,0px));
    max-width:960px;margin:0 auto;width:100%;
  }

  .badge{
    display:inline-flex;align-items:center;gap:.6em;
    align-self:flex-start;
    margin:0;
    padding:.5em 1em;border:1px solid var(--line);border-radius:999px;
    background:rgba(255,255,255,.03);
    font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-dim);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2.4s ease-out infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(110,231,215,.5)}
    70%{box-shadow:0 0 0 11px rgba(110,231,215,0)}
    100%{box-shadow:0 0 0 0 rgba(110,231,215,0)}
  }

  h1{
    font-family:var(--serif);
    font-weight:300;
    font-size:clamp(2.9rem,10vw,6.5rem);
    line-height:.98;
    letter-spacing:-.02em;
    margin:.45em 0 0;
  }
  h1 .sur{display:block;color:var(--ink-dim)}

  .rule{width:64px;height:1px;background:var(--accent);opacity:.7;margin:clamp(24px,4vw,38px) 0}

  .lede{
    font-size:clamp(1.02rem,2.4vw,1.3rem);
    line-height:1.65;color:var(--ink-dim);
    max-width:44ch;margin:0;
  }
  .lede strong{color:var(--ink);font-weight:400}

  .links{display:flex;flex-wrap:wrap;gap:.25rem 1.75rem;margin:clamp(26px,5vw,46px) 0 0;padding:0;list-style:none}
  .links a{
    color:var(--ink);text-decoration:none;font-size:.95rem;
    display:inline-flex;align-items:center;gap:.5em;
    /* 44px min touch target */
    min-height:44px;
    border-bottom:1px solid transparent;
    transition:border-color .25s,color .25s;
  }
  .links a:hover,.links a:focus-visible{color:var(--accent);border-bottom-color:var(--accent);outline:none}
  .links svg{width:15px;height:15px;fill:currentColor;opacity:.8}

  footer{
    position:relative;z-index:1;
    display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;justify-content:space-between;
    padding:var(--pad-y) max(var(--pad-x),env(safe-area-inset-right,0px))
            calc(var(--pad-y) + env(safe-area-inset-bottom,0px))
            max(var(--pad-x),env(safe-area-inset-left,0px));
    border-top:1px solid var(--line);
    color:var(--ink-faint);font-size:.78rem;letter-spacing:.04em;
    max-width:960px;margin:0 auto;width:100%;
  }

  /* entrance */
  .fade{opacity:0;transform:translateY(14px);animation:rise .9s cubic-bezier(.22,.68,0,1) forwards}
  .badge.fade{animation-delay:.05s}
  h1.fade{animation-delay:.16s}
  .rule.fade{animation-delay:.3s}
  .lede.fade{animation-delay:.4s}
  .links.fade{animation-delay:.52s}
  footer.fade{animation-delay:.64s}
  @keyframes rise{to{opacity:1;transform:none}}

  /* phones: 90px blur on 50vmax boxes is costly on low-end GPUs; grid tightens */
  @media (max-width:640px){
    .aura span{filter:blur(60px);opacity:.42}
    .grid{background-size:48px 48px}
    footer{font-size:.72rem}
  }

  /* short landscape: give the type less vertical appetite */
  @media (max-height:520px) and (orientation:landscape){
    h1{font-size:clamp(2rem,7vw,3.4rem)}
    main{padding-block:32px}
    .rule{margin:18px 0}
  }

  @media (prefers-reduced-motion:reduce){
    .fade{animation:none;opacity:1;transform:none}
    .aura span,.dot{animation:none}
  }
</style>
</head>
<body>
  <div class="aura" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="grid" aria-hidden="true"></div>

  <main>
    <p class="badge fade"><span class="dot" aria-hidden="true"></span> Coming soon</p>

    <h1 class="fade">Nikhil<span class="sur">Khilwani</span></h1>

      A new portfolio is <strong>in the works</strong> — selected projects,

    <ul class="links fade">

        GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/nikhilkhilwani" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM2.4 21h5.16V9.5H2.4V21Zm7.74-11.5H15v1.57h.07a3.5 3.5 0 0 1 3.16-1.74c3.38 0 4 2.22 4 5.11V21h-5.14v-5.7c0-1.36-.03-3.11-1.9-3.11-1.9 0-2.19 1.48-2.19 3v5.81h-4.86V9.5Z"/></svg>
        LinkedIn</a></li>
    </ul>
  </main>

  <footer class="fade">
    <span>&copy; <span id="yr">2026</span> Nikhil Khilwani</span>
    <span>Built with care &middot; more soon</span>
  </footer>

  <script>document.getElementById("yr").textContent = new Date().getFullYear();</script>
</body>
</html>
