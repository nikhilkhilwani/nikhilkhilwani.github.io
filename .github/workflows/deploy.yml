name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; queue instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 22: the test scripts import .ts modules directly and rely on
          # Node's built-in type stripping being on by default.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # Covers the pure logic, and — via scripts/test-pdf.mjs — verifies the
      # encryption tools against pdf.js, an independent implementation. That
      # also tripwires the third-party error strings classifyPasswordError
      # depends on, which no other check would notice drifting.
      - run: npm test
      - run: npm run build
      # Verifies the built pages against their scripts — catches an id typo
      # that neither TypeScript nor the unit tests can see.
      - run: node scripts/test-dom.mjs
      - run: node scripts/test-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
